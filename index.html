}
function showCopyFallback(text,message){const box=document.getElementById('manual-copy');box.classList.remove('hidden');const field=document.getElementById('plan-text');field.value=text;field.focus();field.select();document.getElementById('status').textContent=message;}
async function sharePlan(){const text=planMessage();if(text===null)return;const button=document.getElementById('share');if(typeof navigator.share!=='function'){showCopyFallback(text,'Нажми «Скопировать план» или скопируй текст ниже.');return;}button.disabled=true;try{await navigator.share({title:'Наше свидание ♡',text});document.getElementById('status').textContent='План передан в выбранное приложение ♡';}catch(error){if(error.name==='AbortError'){document.getElementById('status').textContent='Отправка отменена. Твой выбор сохранён.';}else{showCopyFallback(text,'Меню отправки недоступно. Скопируй план в сообщение.');}}finally{button.disabled=false;}}
async function copyPlan(){const text=planMessage();if(text===null)return;try{if(!navigator.clipboard?.writeText)throw Error('Clipboard unavailable');await navigator.clipboard.writeText(text);document.getElementById('manual-copy').classList.add('hidden');document.getElementById('status').textContent='План скопирован — вставь его в наш чат 💌';}catch{showCopyFallback(text,'Автоматическое копирование недоступно. Текст ниже можно скопировать вручную.');}}

async function saveCard(){if(!document.getElementById('date').reportValidity()||!document.getElementById('time').reportValidity())return;const b=document.getElementById('save');b.disabled=true;try{await document.fonts.ready;const canvas=document.createElement('canvas');canvas.width=1080;canvas.height=1350;const c=canvas.getContext('2d');c.fillStyle='#f9e7ec';c.fillRect(0,0,1080,1350);c.fillStyle='#fffaf8';c.beginPath();c.roundRect(60,60,960,1230,35);c.fill();c.textAlign='center';c.fillStyle='#b53f61';c.font='italic 60px Georgia';c.fillText('love is…',540,150);c.fillStyle='#522d3b';c.font='52px Georgia';c.fillText('Это будет наш день.',540,232);const img=document.getElementById('love-image');if(img.complete&&img.naturalWidth){let w=270,h=270*img.naturalHeight/img.naturalWidth;if(h>305){w*=305/h;h=305}c.drawImage(img,540-w/2,270,w,h)}c.fillStyle='#b53f61';c.font='32px Arial';const d=new Date(state.date+'T12:00:00');c.fillText(d.toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'})+' · '+state.time,540,635);['day','dinner','evening'].forEach((key,i)=>{const y=733+i*128;c.textAlign='left';c.fillStyle='#856572';c.font='24px Arial';c.fillText(['ДНЁМ','НА УЖИН','ПОСЛЕ УЖИНА'][i],150,y);c.fillStyle='#522d3b';c.font='34px Arial';c.fillText(options[key][state[key]][1],150,y+48);c.strokeStyle='#ecd6dd';c.beginPath();c.moveTo(150,y+75);c.lineTo(930,y+75);c.stroke()});c.textAlign='center';c.fillStyle='#b53f61';c.font='39px "Marck Script", cursive';if(state.fines){c.font='28px Arial';c.fillText('Экстра: оплатить штрафы ♡',540,1125);c.font='39px "Marck Script", cursive';}c.fillText('Мой любимый пункт в этом плане — ты.',540,1180);const a=document.createElement('a');a.download='Наше свидание.png';a.href=canvas.toDataURL('image/png');a.click();document.getElementById('status').textContent='Открытка готова — сохрани её себе ♡'}catch{document.getElementById('status').textContent='Не удалось сохранить картинку. Попробуй ещё раз.'}finally{b.disabled=false}}
window.addEventListener('hashchange',()=>render());render(false);
if(document.modelContext?.registerTool){try{Promise.resolve(document.modelContext.registerTool({name:'configure_date_plan',description:'Выбрать занятия для свидания и показать готовый план. Ничего не бронирует и не отправляет.',inputSchema:{type:'object',properties:{day:{type:'integer',minimum:0,maximum:7},dinner:{type:'integer',minimum:0,maximum:8},evening:{type:'integer',minimum:0,maximum:3}},required:['day','dinner','evening'],additionalProperties:false},annotations:{readOnlyHint:false},execute:input=>{if(!input||Object.keys(input).some(k=>!['day','dinner','evening'].includes(k))||!['day','dinner','evening'].every(k=>Number.isInteger(input[k])&&input[k]>=0&&input[k]<options[k].length))throw Error('Для дня нужен индекс от 0 до 7, для ужина — от 0 до 8, для вечера — от 0 до 3');Object.assign(state,input);persist();history.replaceState(null,'','#plan');render();return Object.fromEntries(['day','dinner','evening'].map(k=>[k,options[k][state[k]][1]]))}})).catch(()=>{})}catch{}}
</script>
